<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acción Acuicultura · Panel Admin</title>
<style>
  :root{
    --primary:#0e7490;
    --primary-dark:#155e75;
    --primary-light:#e0f2fe;
    --accent:#f59e0b;
    --bg:#f4f7f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --ok:#059669;
    --error:#dc2626;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 2px 6px rgba(15,23,42,.06);
    --shadow-md:0 8px 24px -8px rgba(15,23,42,.14);
    --shadow-lg:0 20px 45px -15px rgba(15,23,42,.22);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);padding-bottom:50px;
  }
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none;}
  body::before{width:440px;height:440px;background:radial-gradient(circle,rgba(14,116,144,.16),transparent 70%);top:-140px;right:-110px;}
  body::after{width:540px;height:540px;background:radial-gradient(circle,rgba(245,158,11,.10),transparent 70%);bottom:-180px;left:-130px;}

  .topbar{
    position:relative;background:linear-gradient(120deg,#0b3c4d 0%,#0e7490 60%,#0891b2 130%);
    color:#fff;padding:20px 22px 42px;overflow:hidden;
  }
  .topbar .inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:1.3rem;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .brand h1{margin:0;font-size:1.1rem;}
  .brand p{margin:2px 0 0;font-size:.78rem;opacity:.85;}
  .topbar .btn{
    background:#fff;color:var(--primary-dark);border:none;border-radius:12px;
    padding:10px 15px;font-weight:700;font-size:.8rem;cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.35);display:inline-flex;align-items:center;gap:6px;
    transition:transform .2s,box-shadow .2s;
  }
  .topbar .btn:hover{transform:translateY(-2px);}
  .topbar .btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35);}
  .user-chip{
    display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 8px 6px 14px;
    font-size:.8rem;color:#fff;
  }
  .user-chip .btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px;font-size:.75rem;box-shadow:none;}

  main{max-width:1000px;margin:0 auto;padding:0 16px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:24px 26px;margin-top:18px;
  }
  .card h2{display:flex;align-items:center;gap:11px;margin:0 0 4px;font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--primary-dark);}
  .card h2 .ico{width:36px;height:36px;border-radius:11px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;}
  .card .desc{margin:0 0 18px;font-size:.85rem;color:var(--muted);}

  .filtro-bar{display:flex;gap:10px;align-items:stretch;margin-bottom:16px;flex-wrap:wrap;}
  .filtro-search{position:relative;flex:1;min-width:220px;}
  .filtro-search .fs-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.95rem;opacity:.65;}
  .filtro-search input{
    width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--border);border-radius:12px;
    font:inherit;font-size:.9rem;background:#fff;color:var(--text);
    transition:border-color .25s,box-shadow .25s;
  }
  .filtro-search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(14,116,144,.12);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    border:none;border-radius:12px;padding:11px 20px;font:inherit;font-weight:700;font-size:.88rem;
    cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .btn.primary{background:linear-gradient(135deg,var(--primary),#0891b2);color:#fff;box-shadow:0 10px 22px -8px rgba(14,116,144,.55);}
  .btn.primary:hover{transform:translateY(-2px);}
  .btn.ghost{background:#fff;border:1.5px solid var(--border);color:var(--primary-dark);}
  .btn.ghost:hover{border-color:var(--primary);background:var(--primary-light);}
  .btn.small{padding:7px 12px;font-size:.78rem;border-radius:10px;}
  .btn.warn{background:#fef2f2;border:1px solid #fecaca;color:var(--error);}
  .btn.warn:hover{background:#fee2e2;}
  .btn.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:var(--ok);}
  .btn.ok:hover{background:#d1fae5;}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.72rem;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.05em;}
  .field input,.field select{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
    font:inherit;font-size:.92rem;color:var(--text);background:#fff;
    transition:border-color .25s,box-shadow .25s;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(14,116,144,.12);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  .field.full{grid-column:1/-1;}

  .filtro-count{font-size:.76rem;color:var(--muted);font-weight:700;margin:0 0 10px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff;}
  thead th{
    background:var(--primary);color:#fff;text-align:left;padding:12px 14px;
    font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
  }
  tbody td{padding:12px 14px;border-top:1px solid var(--border);vertical-align:middle;}
  tbody tr:nth-child(even){background:#f8fbfc;}
  tbody tr:hover{background:var(--primary-light);}
  tbody tr.inactivo{opacity:.5;}
  .acciones{display:flex;gap:6px;flex-wrap:wrap;}
  .estado{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:99px;}
  .estado.activo{background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0;}
  .estado.inactivo{background:#fef2f2;color:var(--error);border:1px solid #fecaca;}
  .empty-state{text-align:center;color:var(--muted);padding:30px 10px;font-size:.9rem;line-height:1.6;}

  .paginador{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .paginador .info{font-size:.8rem;color:var(--muted);font-weight:700;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(8,20,28,.55);
    backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:200;padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:20px;padding:24px;max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    animation:modalIn .3s cubic-bezier(.22,.68,0,1);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.96);}to{opacity:1;transform:none;}}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px;}
  .modal h3{margin:0;color:var(--primary-dark);font-size:1.05rem;}
  .modal .sub{margin:4px 0 0;font-size:.8rem;color:var(--muted);}
  .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#94a3b8;line-height:1;transition:color .2s,transform .2s;}
  .modal-close:hover{color:var(--text);transform:rotate(90deg);}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);
    background:#0f172a;color:#fff;padding:14px 20px;border-radius:14px;
    box-shadow:var(--shadow-lg);font-size:.88rem;font-weight:600;z-index:300;
    opacity:0;transition:all .45s cubic-bezier(.22,.68,0,1);max-width:92vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast.ok{background:linear-gradient(135deg,#059669,#10b981);}
  .toast.error{background:linear-gradient(135deg,#dc2626,#ef4444);}
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand">
      <div class="logo">🐟</div>
      <div>
        <h1>Acción Acuicultura</h1>
        <p>Panel de administración</p>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <span class="user-chip" id="userChip" style="display:none;">
        👤 <b id="userName"></b>
        <button type="button" class="btn ghost" onclick="logout()">Salir</button>
      </span>
      <button type="button" class="btn ghost" onclick="window.location.href='cuestionario.html'">📝 Cuestionario</button>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <h2><span class="ico">👥</span> Administración de clientes</h2>
    <p class="desc">Crea, edita, busca o desactiva clientes. Los desactivados desaparecen del autocompletado del cuestionario pero no se borran.</p>

    <div class="filtro-bar">
      <div class="filtro-search">
        <span class="fs-ico">🔎</span>
        <input type="text" id="busqueda" placeholder="Buscar por razón social, RFC o ciudad…" autocomplete="off">
      </div>
      <button type="button" class="btn primary" onclick="abrirNuevo()">+ Nuevo cliente</button>
    </div>

    <div id="listaClientes"></div>
  </section>
</main>

<!-- Modal: nuevo / editar cliente -->
<div class="modal-overlay" id="clientModal">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="modalTitulo">Nuevo cliente</h3>
        <p class="sub">Los campos con * son obligatorios.</p>
      </div>
      <button class="modal-close" onclick="cerrarModal()">&times;</button>
    </div>
    <div class="grid">
      <div class="field full">
        <label>Razón Social *</label>
        <input type="text" id="c_razonSocial">
      </div>
      <div class="field">
        <label>RFC *</label>
        <input type="text" id="c_rfc">
      </div>
      <div class="field">
        <label>Giro del Negocio</label>
        <select id="c_giroDelNegocio"></select>
      </div>
      <div class="field">
        <label>Nombre del Comprador</label>
        <input type="text" id="c_nombreComprador">
      </div>
      <div class="field">
        <label>Teléfono</label>
        <input type="text" id="c_telefono">
      </div>
      <div class="field">
        <label>Nombre Comercial</label>
        <input type="text" id="c_nombreComercial">
      </div>
      <div class="field full">
        <label>Ciudad / Ruta</label>
        <input type="text" id="c_ciudadRuta">
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
      <button type="button" class="btn ghost" onclick="cerrarModal()">Cancelar</button>
      <button type="button" class="btn primary" id="btnGuardarCliente" onclick="guardarCliente()">Guardar cliente</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* =========================================================
   SESIÓN Y ROL — solo admin entra aquí
   ========================================================= */
let usuarioActual = null;
let clientes = [];
let paginaActual = 1;
const POR_PAGINA = 6;

const GIROS = ["Restaurante","Hotel","Pescadería","Supermercado","Mayoreo Nacional","Mayoreo Rutas","Autoservicio Regional","Industrial"];

function llenarSelectGiro(){
  const el = document.getElementById("c_giroDelNegocio");
  el.innerHTML = `<option value="">Selecciona…</option>` + GIROS.map(g => `<option value="${g}">${g}</option>`).join("");
}

async function iniciarSesion(){
  try {
    if (typeof supabaseClient === "undefined") {
      toast("No hay conexión con Supabase (falta config.js)", "error");
      return;
    }
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }

    const { data } = await supabaseClient
      .from("usuarios")
      .select("rol, activo")
      .eq("id", session.user.id)
      .maybeSingle();

    if (!data || !data.activo || data.rol !== "admin") {
      toast("Solo el admin puede entrar al panel", "error");
      await supabaseClient.auth.signOut();
      setTimeout(() => window.location.href = "login.html", 1200);
      return;
    }

    usuarioActual = { id: session.user.id, email: session.user.email, rol: data.rol };
    const chip = document.getElementById("userChip");
    document.getElementById("userName").textContent = "Admin: " + usuarioActual.email;
    chip.style.display = "inline-flex";
    cargarClientes();
  } catch (e) {
    toast("Error al verificar sesión", "error");
  }
}

async function logout(){
  try { await supabaseClient.auth.signOut(); } catch(e){}
  window.location.href = "login.html";
}

/* =========================================================
   CARGA DE CLIENTES (admin ve todos, incluidos inactivos)
   ========================================================= */
async function cargarClientes(){
  const cont = document.getElementById("listaClientes");
  cont.innerHTML = `<div class="empty-state">Cargando clientes…</div>`;

  let token = "";
  try {
    const s = await supabaseClient.auth.getSession();
    token = s && s.data && s.data.session ? s.data.session.access_token : "";
  } catch(e){}

  try {
    const res = await fetch("/api/clients?todos=1", {
      headers: token ? { "Authorization": "Bearer " + token } : {}
    });
    if (!res.ok) throw new Error("red");
    clientes = await res.json();
  } catch (e) {
    clientes = [];
    cont.innerHTML = `<div class="empty-state">⚠ No se pudieron cargar los clientes.<br><small>¿Está desplegada la función /api/clients y configurada la tabla 'clientes'?</small></div>`;
    return;
  }
  paginaActual = 1;
  renderLista();
}

/* =========================================================
   LISTA + BUSCADOR + PAGINACIÓN
   ========================================================= */
const busquedaInput = document.getElementById("busqueda");
busquedaInput.addEventListener("input", () => {
  paginaActual = 1;
  renderLista();
});

function listaFiltrada(){
  const q = busquedaInput.value.trim().toLowerCase();
  if (!q) return clientes;
  return clientes.filter(c => [c.razonSocial, c.rfc, c.ciudadRuta, c.nombreComercial]
    .filter(Boolean).join(" ").toLowerCase().includes(q));
}

function renderLista(){
  const list = listaFiltrada();
  const cont = document.getElementById("listaClientes");

  if (!list.length) {
    cont.innerHTML = `<div class="empty-state">🔎 No hay clientes${busquedaInput.value.trim() ? ' para "' + busquedaInput.value.trim() + '"' : ""}.</div>`;
    return;
  }

  const totalPaginas = Math.max(1, Math.ceil(list.length / POR_PAGINA));
  if (paginaActual > totalPaginas) paginaActual = totalPaginas;
  const inicio = (paginaActual - 1) * POR_PAGINA;
  const paginado = list.slice(inicio, inicio + POR_PAGINA);

  const filas = paginado.map(c => `
    <tr class="${c.activo === false ? "inactivo" : ""}">
      <td><b>${escapeHtml(c.razonSocial)}</b><br><small style="color:var(--muted);">${escapeHtml(c.nombreComercial || "—")}</small></td>
      <td>${escapeHtml(c.rfc || "—")}</td>
      <td>${escapeHtml(c.giroDelNegocio || "—")}</td>
      <td>${escapeHtml(c.nombreComprador || "—")}</td>
      <td>${escapeHtml(c.telefono || "—")}</td>
      <td>${escapeHtml(c.ciudadRuta || "—")}</td>
      <td><span class="estado ${c.activo === false ? "inactivo" : "activo"}">${c.activo === false ? "Inactivo" : "Activo"}</span></td>
      <td>
        <div class="acciones">
          <button type="button" class="btn ghost small" onclick="abrirEditar('${c.id}')">✏️ Editar</button>
          <button type="button" class="btn ${c.activo === false ? "ok" : "warn"} small" onclick="cambiarActivo('${c.id}', ${c.activo === false})">${c.activo === false ? "🔄 Activar" : "🚫 Desactivar"}</button>
        </div>
      </td>
    </tr>`).join("");

  cont.innerHTML = `
    <div class="filtro-count">${list.length} cliente${list.length !== 1 ? "s" : ""}${busquedaInput.value.trim() ? ' para "' + escapeHtml(busquedaInput.value.trim()) + '"' : ""}</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Razón Social</th><th>RFC</th><th>Giro</th><th>Comprador</th><th>Teléfono</th><th>Ciudad / Ruta</th><th>Estado</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
    ${paginadorHTML(list.length, totalPaginas)}`;
}

function paginadorHTML(total, totalPaginas){
  if (totalPaginas <= 1) return "";
  return `<div class="paginador">
    <button type="button" class="btn ghost small" ${paginaActual === 1 ? "disabled" : ""} onclick="cambiarPagina(${paginaActual - 1})">← Anterior</button>
    <span class="info">Página ${paginaActual} de ${totalPaginas} · ${total} clientes</span>
    <button type="button" class="btn ghost small" ${paginaActual === totalPaginas ? "disabled" : ""} onclick="cambiarPagina(${paginaActual + 1})">Siguiente →</button>
  </div>`;
}

function cambiarPagina(p){
  const totalPaginas = Math.max(1, Math.ceil(listaFiltrada().length / POR_PAGINA));
  if (p < 1 || p > totalPaginas) return;
  paginaActual = p;
  renderLista();
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================================================
   MODAL: nuevo / editar
   ========================================================= */
let idEditando = null;

function abrirNuevo(){
  idEditando = null;
  document.getElementById("modalTitulo").textContent = "Nuevo cliente";
  ["c_razonSocial","c_rfc","c_nombreComprador","c_telefono","c_nombreComercial","c_ciudadRuta"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("c_giroDelNegocio").value = "";
  document.getElementById("clientModal").classList.add("show");
}

function abrirEditar(id){
  const c = clientes.find(x => String(x.id) === String(id));
  if (!c) { toast("Cliente no encontrado", "error"); return; }
  idEditando = id;
  document.getElementById("modalTitulo").textContent = "Editar cliente";
  document.getElementById("c_razonSocial").value = c.razonSocial || "";
  document.getElementById("c_rfc").value = c.rfc || "";
  document.getElementById("c_giroDelNegocio").value = c.giroDelNegocio || "";
  document.getElementById("c_nombreComprador").value = c.nombreComprador || "";
  document.getElementById("c_telefono").value = c.telefono || "";
  document.getElementById("c_nombreComercial").value = c.nombreComercial || "";
  document.getElementById("c_ciudadRuta").value = c.ciudadRuta || "";
  document.getElementById("clientModal").classList.add("show");
}

function cerrarModal(){ document.getElementById("clientModal").classList.remove("show"); }

async function guardarCliente(){
  const datos = {
    razonSocial: document.getElementById("c_razonSocial").value.trim(),
    rfc: document.getElementById("c_rfc").value.trim(),
    giroDelNegocio: document.getElementById("c_giroDelNegocio").value,
    nombreComprador: document.getElementById("c_nombreComprador").value.trim(),
    telefono: document.getElementById("c_telefono").value.trim(),
    nombreComercial: document.getElementById("c_nombreComercial").value.trim(),
    ciudadRuta: document.getElementById("c_ciudadRuta").value.trim()
  };
  if (!datos.razonSocial || !datos.rfc) {
    toast("Razón Social y RFC son obligatorios", "error");
    return;
  }

  const btn = document.getElementById("btnGuardarCliente");
  btn.disabled = true;
  btn.textContent = "Guardando…";

  let token = "";
  try {
    const s = await supabaseClient.auth.getSession();
    token = s && s.data && s.data.session ? s.data.session.access_token : "";
  } catch(e){}

  const esNuevo = !idEditando;
  try {
    const res = await fetch(esNuevo ? "/api/clients" : "/api/clients?id=" + idEditando, {
      method: esNuevo ? "POST" : "PUT",
      headers: {
        "Content-Type": "application/json",
        ...(token ? { "Authorization": "Bearer " + token } : {})
      },
      body: JSON.stringify(datos)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "red");
    }
    toast(esNuevo ? "Cliente creado" : "Cliente actualizado", "ok");
    cerrarModal();
    cargarClientes();
  } catch (err) {
    toast("No se pudo guardar: " + (err.message || "error"), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar cliente";
  }
}

/* =========================================================
   ACTIVAR / DESACTIVAR (eliminación suave)
   ========================================================= */
async function cambiarActivo(id, activar){
  const msg = activar
    ? "¿Activar este cliente para que aparezca en el cuestionario?"
    : "¿Desactivar este cliente? No se borra, solo deja de aparecer en el buscador.";
  if (!confirm(msg)) return;

  let token = "";
  try {
    const s = await supabaseClient.auth.getSession();
    token = s && s.data && s.data.session ? s.data.session.access_token : "";
  } catch(e){}

  try {
    const res = await fetch("/api/clients?id=" + id, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        ...(token ? { "Authorization": "Bearer " + token } : {})
      },
      body: JSON.stringify({ activo: activar })
    });
    if (!res.ok) throw new Error("red");
    toast(activar ? "Cliente activado" : "Cliente desactivado", "ok");
    cargarClientes();
  } catch (err) {
    toast("No se pudo actualizar el cliente", "error");
  }
}

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function toast(msg, type){
  const t = document.getElementById("toast");
  t.textContent = (type === "ok" ? "✓ " : "✘ ") + msg;
  t.className = "toast show " + (type || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

/* =========================================================
   ARRANQUE
   ========================================================= */
llenarSelectGiro();
iniciarSesion();
</script>
