[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# "publish = '.'" sirve TODA la carpeta como archivos públicos -- sin
# esto, cualquiera podía descargar los setup-*.sql (esquema completo
# de la base de datos, políticas RLS, comentarios internos) desde
# tusitio.netlify.app/setup-algo.sql. Se bloquean por extensión.
[[redirects]]
  from = "/*.sql"
  to = "/login.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/login.html"
  status = 404
  force = true

# Mismo motivo que arriba: sin esto, cualquiera podía bajarse el
# código fuente de las funciones de Netlify (con la lógica de permisos
# y de qué tablas toca cada endpoint) desde
# tusitio.netlify.app/netlify/functions/algo.mjs.
[[redirects]]
  from = "/netlify/functions/*"
  to = "/login.html"
  status = 404
  force = true

