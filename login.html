<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acción Acuicultura · Iniciar sesión</title>
<link rel="stylesheet" href="shared.css?v=19">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(120deg,#0b3c4d 0%,#0e7490 55%,#0891b2 130%);
    display:flex;align-items:center;justify-content:center;
    padding:20px;position:relative;overflow:hidden;
  }
  /* Manchas suaves de fondo, mismo lenguaje visual que el resto de la app */
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;}
  body::before{width:420px;height:420px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);top:-120px;left:-110px;}
  body::after{width:480px;height:480px;background:radial-gradient(circle,rgba(245,158,11,.16),transparent 70%);bottom:-160px;right:-120px;}
  /* Burbujas subiendo -- guiño al tema de acuicultura, le da vida al fondo */
  .burbuja{
    position:fixed;bottom:-10vh;border-radius:50%;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    pointer-events:none;z-index:0;animation:subirBurbuja linear infinite;
  }
  @keyframes subirBurbuja{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:.85;}
    90%{opacity:.5;}
    100%{transform:translateY(-115vh) translateX(var(--deriva,24px));opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){ .burbuja{animation:none;display:none;} }
  .card{
    background:#fff;border-radius:20px;
    box-shadow:var(--shadow-lg);
    padding:34px 30px;max-width:380px;width:100%;
    position:relative;z-index:2;
    animation:cardIn .55s cubic-bezier(.22,.68,0,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:none;}}
  .top-actions{position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .logo{
    width:54px;height:54px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:7px;flex-shrink:0;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand h1{margin:0;font-size:1.05rem;color:var(--text);}
  .brand p{margin:2px 0 0;font-size:.78rem;color:var(--muted);}
  .field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.72rem;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.05em;}
  .field input{
    padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
    font:inherit;font-size:.92rem;color:var(--text);
    transition:border-color .2s,box-shadow .2s;
  }
  .field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(14,116,144,.12);}
  .btn{
    width:100%;border:none;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:.92rem;
    background:linear-gradient(135deg,var(--primary),#0891b2);color:#fff;cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(14,116,144,.55);
    transition:transform .2s ease,box-shadow .2s ease,opacity .2s;
    margin-top:6px;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .msg{
    margin-top:14px;padding:10px 12px;border-radius:10px;font-size:.82rem;font-weight:600;
    display:none;
  }
  .msg.error{display:block;background:#fef2f2;color:var(--error);border:1px solid #fecaca;}
  .msg.ok{display:block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;}
  .footer-note{margin-top:18px;text-align:center;font-size:.74rem;color:var(--muted);}
  .top-actions{display:flex;justify-content:center;margin-bottom:14px;}
</style>
</head>
<body>

<span class="burbuja" style="left:8%;width:18px;height:18px;animation-duration:14s;animation-delay:0s;--deriva:14px;"></span>
<span class="burbuja" style="left:20%;width:12px;height:12px;animation-duration:10s;animation-delay:2s;--deriva:-18px;"></span>
<span class="burbuja" style="left:32%;width:26px;height:26px;animation-duration:17s;animation-delay:5s;--deriva:20px;"></span>
<span class="burbuja" style="left:48%;width:9px;height:9px;animation-duration:9s;animation-delay:1s;--deriva:-10px;"></span>
<span class="burbuja" style="left:63%;width:20px;height:20px;animation-duration:15s;animation-delay:4s;--deriva:16px;"></span>
<span class="burbuja" style="left:76%;width:14px;height:14px;animation-duration:11s;animation-delay:7s;--deriva:-22px;"></span>
<span class="burbuja" style="left:88%;width:22px;height:22px;animation-duration:16s;animation-delay:3s;--deriva:12px;"></span>
<span class="burbuja" style="left:57%;width:11px;height:11px;animation-duration:12s;animation-delay:8.5s;--deriva:-14px;"></span>

<div class="top-actions">
  <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
</div>
<div class="card">
  <div class="brand">
    <div class="logo"><img src="accion_acuicola.png" alt="Acción Acuacultura"></div>
    <div>
      <h1>Acción Acuacultura</h1>
      <p>Acceso · Comercial y Oficina</p>
    </div>
  </div>

  <form id="loginForm">
    <div class="field">
      <label>Número de empleado</label>
      <input type="text" id="email" required autocomplete="username" placeholder="Ej. 1042">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="loginBtn">Iniciar sesión</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="footer-note">¿No tienes cuenta? Pídele a tu administrador que te dé de alta.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js?v=19"></script>
<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("loginBtn");

// Si ya hay sesión activa y con rol válido, saltamos directo al cuestionario.
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const ok = await tieneRolValido(session.user.id);
    if (ok) window.location.href = "index.html";
  }
})();

async function tieneRolValido(userId){
  const { data, error } = await supabaseClient
    .from("usuarios")
    .select("rol, activo")
    .eq("id", userId)
    .maybeSingle();
  if (error || !data || !data.activo) return false;
  return ["comercial", "oficina", "coordinador", "gerente", "admin"].includes(data.rol);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "msg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Entrando…";

  const entrada = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  let email = entrada;
  if (!entrada.includes("@")) {
    // No es correo -> es código de empleado. Se busca cuál es el
    // correo real de esa cuenta en vez de adivinar el dominio interno
    // -- si el admin le puso correo real Y código, su cuenta de Auth
    // usa el correo real, no el ficticio "@interno...".
    const { data: correoReal, error: lookupErr } = await supabaseClient.rpc("email_por_codigo_empleado", { p_codigo: entrada });
    if (lookupErr || !correoReal) {
      msg.className = "msg error";
      msg.textContent = "Correo/código o contraseña incorrectos.";
      btn.disabled = false;
      btn.textContent = "Iniciar sesión";
      return;
    }
    email = correoReal;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msg.className = "msg error";
    msg.textContent = "Correo/código o contraseña incorrectos.";
    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
    return;
  }

  const ok = await tieneRolValido(data.user.id);
  if (!ok) {
    msg.className = "msg error";
    msg.textContent = "Tu cuenta no tiene un rol asignado o está desactivada. Contacta al administrador.";
    await supabaseClient.auth.signOut();
    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
    return;
  }

  msg.className = "msg ok";
  msg.textContent = "¡Bienvenido! Entrando…";
  await registrarLogin();
  window.location.href = "index.html";
});
</script>
</body>
</html>
