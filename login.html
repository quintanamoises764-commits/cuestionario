<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acción Acuicultura · Iniciar sesión</title>
<style>
  :root{
    --primary:#0e7490;
    --primary-dark:#155e75;
    --primary-light:#e0f2fe;
    --accent:#f59e0b;
    --bg:#f4f7f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --error:#dc2626;
    --shadow-md:0 8px 24px -8px rgba(15,23,42,.14);
    --shadow-lg:0 20px 45px -15px rgba(15,23,42,.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(120deg,#0b3c4d 0%,#0e7490 55%,#0891b2 130%);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);
    padding:34px 30px;max-width:380px;width:100%;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .logo{
    width:44px;height:44px;border-radius:13px;background:var(--primary-light);
    display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0;
  }
  .brand h1{margin:0;font-size:1.05rem;color:var(--text);}
  .brand p{margin:2px 0 0;font-size:.78rem;color:var(--muted);}
  .field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.72rem;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.05em;}
  .field input{
    padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
    font:inherit;font-size:.92rem;color:var(--text);
    transition:border-color .2s,box-shadow .2s;
  }
  .field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(14,116,144,.12);}
  .btn{
    width:100%;border:none;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:.92rem;
    background:linear-gradient(135deg,var(--primary),#0891b2);color:#fff;cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(14,116,144,.55);
    transition:transform .2s ease,box-shadow .2s ease,opacity .2s;
    margin-top:6px;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .msg{
    margin-top:14px;padding:10px 12px;border-radius:10px;font-size:.82rem;font-weight:600;
    display:none;
  }
  .msg.error{display:block;background:#fef2f2;color:var(--error);border:1px solid #fecaca;}
  .msg.ok{display:block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;}
  .footer-note{margin-top:18px;text-align:center;font-size:.74rem;color:var(--muted);}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo">🐟</div>
    <div>
      <h1>Acción Acuicultura</h1>
      <p>Acceso · Comercial y Oficina</p>
    </div>
  </div>

  <form id="loginForm">
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="loginBtn">Iniciar sesión</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="footer-note">¿No tienes cuenta? Pídele a tu administrador que te dé de alta.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("loginBtn");

// Si ya hay sesión activa y con rol válido, saltamos directo al cuestionario.
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const ok = await tieneRolValido(session.user.id);
    if (ok) window.location.href = "cuestionario.html";
  }
})();

async function tieneRolValido(userId){
  const { data, error } = await supabaseClient
    .from("usuarios")
    .select("rol, activo")
    .eq("id", userId)
    .maybeSingle();
  if (error || !data || !data.activo) return false;
  return ["comercial", "oficina", "admin"].includes(data.rol);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "msg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Entrando…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msg.className = "msg error";
    msg.textContent = "Correo o contraseña incorrectos.";
    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
    return;
  }

  const ok = await tieneRolValido(data.user.id);
  if (!ok) {
    msg.className = "msg error";
    msg.textContent = "Tu cuenta no tiene un rol asignado o está desactivada. Contacta al administrador.";
    await supabaseClient.auth.signOut();
    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
    return;
  }

  msg.className = "msg ok";
  msg.textContent = "¡Bienvenido! Entrando…";
  window.location.href = "cuestionario.html";
});
</script>
</body>
</html>
